import java.nio.file.Files
import java.nio.file.StandardCopyOption

plugins {
    id "com.gradleup.shadow" version "${shadow_version}" apply false
    id "net.fabricmc.fabric-loom" version "${loom_version}" apply false
    id "net.neoforged.moddev" version "${moddev_version}" apply false
}

// The root project aggregates the final, installable JARs into its own build/ directory,
// so it needs a base plugin to get a clean task that removes them.
apply plugin: "base"

allprojects {
    repositories {
        mavenCentral()
        maven {
            name = "Modrinth"
            url = "https://api.modrinth.com/maven"
        }
        maven {
            name = "NeoForged"
            url = "https://maven.neoforged.net/releases"
        }
    }
}

// :minecraft is only a grouping directory for the Minecraft-side modules, and :minecraft:common is a
// shared source directory rather than a project of its own: the two loader modules compile its sources
// directly (see their build scripts), so that the shared classes and dmcc.mixins.json have exactly one
// author and each loader still produces a self-contained JAR.
configure(subprojects.findAll { it.path != ":minecraft" && it.path != ":minecraft:common" }) { subproject ->
    subproject.apply plugin: "java-library"

    subproject.version = mod_version

    subproject.java.toolchain.languageVersion = JavaLanguageVersion.of(25)

    subproject.tasks.withType(JavaCompile).configureEach {
        options.release = 25
        options.encoding = "UTF-8"
    }

    subproject.processResources {
        def propertiesToExpand = new HashMap<String, Object>()
        [
                "mod_version", "jda_version", "slf4j_api_version", "jackson_version",
                "okhttp_version", "netty_version", "jemoji_version",
                "minecraft_version", "minecraft_version_range", "neo_version"
        ].each {
            propertiesToExpand.put(it, providers.gradleProperty(it).get())
        }
        propertiesToExpand.put("version", subproject.version.toString())
        filesMatching(["**/*.txt", "**/*.yml", "**/*.toml", "**/*.json"]) {
            expand(propertiesToExpand)
        }
    }
}

/**
 * Builds the single universal mod JAR.
 * <p>
 * It carries everything: the core shadow payload, the shared {@code minecraft/common} classes and mixin
 * configuration, and both the Fabric metadata ({@code fabric.mod.json}) and the NeoForge metadata
 * ({@code META-INF/neoforge.mods.toml}). Each loader reads only its own metadata and loads only its own
 * entry point, so the same file can be dropped into a Fabric or a NeoForge {@code mods} folder, and it
 * still runs as the standalone application through {@code java -jar} because the core shadow JAR's
 * manifest is preserved.
 * <p>
 * The per-loader JARs produced by the {@code :minecraft:fabric} and {@code :minecraft:neoforge} modules are only inputs to
 * this task; the root {@code build/} directory deliberately contains this one file and nothing else.
 */
tasks.register("universalJar") {
    group = "build"
    description = "Builds the single mod JAR that works on Fabric, on NeoForge and as a standalone application."

    def outputFile = new File(rootProject.layout.buildDirectory.get().asFile, "Discord-MC-Chat-${mod_version}.jar")
    def shadowJarFile = project(":core").tasks.named("shadowJar").flatMap { it.archiveFile }
    def fabricJarFile = project(":minecraft:fabric").tasks.named("jar").flatMap { it.archiveFile }
    def neoforgeJarFile = project(":minecraft:neoforge").tasks.named("jar").flatMap { it.archiveFile }
    def tempDir = new File(rootProject.layout.buildDirectory.get().asFile, "universal")
    // Gradle materialises every zipTree() view under build/tmp/.cache/expanded, which would otherwise
    // leave empty zip_<hash> directories behind. Sweep build/tmp too, so that the root build directory
    // contains the universal JAR and nothing else.
    def gradleTmpDir = new File(rootProject.layout.buildDirectory.get().asFile, "tmp")

    dependsOn ":core:shadowJar", ":minecraft:fabric:jar", ":minecraft:neoforge:jar"
    inputs.files(shadowJarFile, fabricJarFile, neoforgeJarFile)
    outputs.file(outputFile)

    doLast {
        tempDir.deleteDir()
        tempDir.mkdirs()

        // The shared minecraft/common classes and dmcc.mixins.json are compiled into both loader JARs.
        // Keep the Fabric copy and let the NeoForge JAR contribute only what it adds on top.
        [[fabricJarFile.get().asFile, DuplicatesStrategy.INCLUDE],
         [neoforgeJarFile.get().asFile, DuplicatesStrategy.EXCLUDE]].each { jarFile, strategy ->
            copy {
                from zipTree(jarFile)
                into tempDir
                exclude "META-INF/MANIFEST.MF"
                duplicatesStrategy = strategy
            }
        }

        outputFile.parentFile.mkdirs()
        Files.copy(
                shadowJarFile.get().asFile.toPath(),
                outputFile.toPath(),
                StandardCopyOption.REPLACE_EXISTING)
        ant.zip(update: "true", destfile: outputFile) {
            fileset(dir: tempDir)
        }

        // Leave the root build directory with nothing but the universal JAR itself.
        tempDir.deleteDir()
        gradleTmpDir.deleteDir()
    }
}

tasks.named("build") {
    dependsOn tasks.named("universalJar")
}
