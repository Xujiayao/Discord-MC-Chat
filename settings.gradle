pluginManagement {
    repositories {
        maven {
            name = "Fabric"
            url = "https://maven.fabricmc.net/"
        }
        maven {
            name = "NeoForged"
            url = "https://maven.neoforged.net/releases"
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    // Lets Gradle download the JDKs that individual tasks ask for. ModDevGradle's asset downloader
    // runs on Java 21 while the mod itself targets Java 25, so without this the IDE sync (which
    // triggers that task) fails on machines that only have a modern JDK installed.
    id "org.gradle.toolchains.foojay-resolver-convention" version "${foojay_version}"
}

// DMCC's platform-independent core.
include(":core")

// The Minecraft-side modules.
// ./minecraft/common holds the code shared by both loaders.
include(":minecraft:common")
include(":minecraft:fabric")
include(":minecraft:neoforge")
