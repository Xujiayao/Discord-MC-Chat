# Mod metadata for the NeoForge build.
# Placeholders are expanded by the root project's processResources task.
modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/Xujiayao/Discord-MC-Chat/issues"

[[mods]]
modId = "discord_mc_chat"
version = "${mod_version}"
displayName = "Discord-MC-Chat"
authors = "Xujiayao"
displayURL = "https://dmcc.xujiayao.com/"
logoFile = "icon/icon.png"
description = '''
Discord-MC-Chat (DMCC), formerly known as MC-Discord-Chat and MCDiscordChat (MCDC), is a practical and powerful Minecraft <> Discord chat bridge inspired by BRForgers/DisFabric.
'''

# DMCC's mixin configuration, shared with the Fabric build through minecraft-common.
[[mixins]]
config = "dmcc.mixins.json"

[[dependencies.discord_mc_chat]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "SERVER"

[[dependencies.discord_mc_chat]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "SERVER"
