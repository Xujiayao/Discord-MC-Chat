apply plugin: "net.fabricmc.fabric-loom"

base {
    archivesName = "Discord-MC-Chat-fabric"
}

// DMCC's Minecraft-side code is shared verbatim with the NeoForge module.
// Minecraft 26.1+ is unobfuscated, so both loaders run against the same official names
// and no remapping step is involved.
sourceSets {
    main {
        java.srcDir "../minecraft-common/src/main/java"
        resources.srcDir "../minecraft-common/src/main/resources"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation project(":core")

    // Compile-only integration dependency; see ModIntegration for the integration template.
    // Vanish only publishes Fabric/Quilt builds for 26.2, so this integration is Fabric-only.
    compileOnly "maven.modrinth:vanish:${project.vanish_version}"
}
